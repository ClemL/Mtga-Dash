/* Every font size is calc(<px> * var(--text-scale)) and the spacing below is what the density setting
   changes; a new rule should use both, or it ignores the Settings menu. */
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #eef0f3;
  --border: #d9dce1;
  --border-strong: #b8bdc6;
  --fg: #1b1f24;

  --selected-border: #1f62c4;
  --good: #137a2e;
  --warn: #8a5800;
  --bad: #b3261e;
  --never: #626973;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --scrim: rgba(15, 18, 22, 0.45);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.18);

  --text-scale: 1;
  --line: 1.5;
  --gap: 8px;
  --bar-py: 10px;
  --btn-py: 5px;
  --btn-px: 10px;
  --input-py: 5px;
  --cell-py: 6px;
  --cell-px: 8px;
  --card-p: 14px;
  --section-gap: 16px;
  --block: 8px;
  --target: 0px;
}

:root[data-density="compact"] {
  --line: 1.35; --gap: 5px; --bar-py: 6px; --btn-py: 2px; --btn-px: 7px; --input-py: 2px;
  --cell-py: 2px; --cell-px: 6px; --card-p: 9px; --section-gap: 10px; --block: 5px;
}

:root[data-density="cozy"] {
  --line: 1.65; --gap: 11px; --bar-py: 14px; --btn-py: 8px; --btn-px: 14px; --input-py: 8px;
  --cell-py: 10px; --cell-px: 11px; --card-p: 20px; --section-gap: 24px; --block: 12px; --target: 36px;
}

/* Cozy is the setting for fingers: 44px is the smallest comfortable touch target. */
@media (pointer: coarse) {
  :root[data-density="cozy"] { --target: 44px; }
}

:root[data-text="90"] { --text-scale: 0.9; }
:root[data-text="115"] { --text-scale: 1.15; }
:root[data-text="130"] { --text-scale: 1.3; }

/* System (no data-theme) follows the device; an explicit Light keeps the base values above. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --bg: #15181d; --panel: #1d2127; --panel-2: #252a31; --border: #323842; --border-strong: #4a5260;
    --fg: #e6e8eb; --fg-dim: #a4acb8; --accent: #7fb0ff; --hover: #26303d; --selected-border: #7fb0ff;
    --good: #5cc97a; --warn: #e0b341; --bad: #ff8a80; --never: #9aa2ae;
    --series-1: #3987e5; --series-2: #d95926; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15181d; --panel: #1d2127; --panel-2: #252a31; --border: #323842; --border-strong: #4a5260;
  --fg: #e6e8eb; --fg-dim: #a4acb8; --accent: #7fb0ff; --hover: #26303d; --selected-border: #7fb0ff;
  --good: #5cc97a; --warn: #e0b341; --bad: #ff8a80; --never: #9aa2ae;
  --series-1: #3987e5; --series-2: #d95926; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);

/* True black: an AMOLED screen turns black pixels off. Text is dimmed a step so white does not glare. */
:root[data-theme="oled"] {
  color-scheme: dark;
  --bg: #000000; --panel: #000000; --panel-2: #0a0a0a; --border: #222222; --border-strong: #363636;
  --fg: #c9c9c9; --fg-dim: #8a8a8a; --accent: #6cb6ff; --hover: #111a24; --selected-border: #6cb6ff;
  --good: #4fbf6c; --warn: #d4a72c; --bad: #ff7b72; --never: #8a8a8a;

/* Black on white, every border black, links underlined, a thick focus ring: text and controls clear
   WCAG's 7:1 enhanced contrast. */
:root[data-theme="contrast"] {
  color-scheme: light;
  --bg: #ffffff; --panel: #ffffff; --panel-2: #ffffff; --border: #000000; --border-strong: #000000;
  --fg: #000000; --fg-dim: #333333; --accent: #0037a6; --hover: #e6ecff; --selected-border: #000000;
  --good: #0b5a1d; --warn: #5c3b00; --bad: #8c1d18; --never: #3d3d3d;

/* Inactive controls stay legible: a faded button would fall below 7:1. */

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: calc(14px * var(--text-scale));

  /* Long emails and identifiers break rather than widen the page on a phone at 130%. */
  overflow-wrap: break-word;
}
a { color: var(--accent); }
h2, p { overflow-wrap: anywhere; }
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; max-width: 1400px; margin: 0 auto; padding: 0 16px; }

button, select, input {
  font: inherit;
  font-size: calc(13px * var(--text-scale));
  color: inherit;
}
button {
  background: var(--panel-2);
  border: 1px solid var(--border-strong);

  padding: var(--btn-py) var(--btn-px);
  min-height: var(--target);

}

  background: var(--panel);

}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

}

  border: 1px solid var(--border-strong);

  border-radius: 4px;
  padding: 0 5px;
  color: var(--fg-dim);
  background: var(--panel);
  white-space: nowrap;
}
.muted { color: var(--fg-dim); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Header */
.bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--gap);
  padding: var(--bar-py) 0;
}
.brand { font-size: calc(18px * var(--text-scale)); margin: 0; font-weight: 700; flex: none; }
/* Takes the free width up to 480px and is the first thing to give it up as the window narrows. */
.search-box {
  flex: 1 1 480px;
  max-width: 480px;
  min-width: 120px;
  display: flex;
  align-items: stretch;
  position: relative;
}
.palette-trigger {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  background: var(--panel);
  color: var(--fg-dim);
  border-radius: 6px;
}
.palette-trigger .pt-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-trigger.filtered .pt-text { color: var(--fg); }
.search-box.has-filter .palette-trigger { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.search-clear { border-left-width: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; flex: none; }
.bar-right { display: flex; align-items: center; gap: var(--gap); margin-left: auto; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 5px; font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); white-space: nowrap; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--never); }
.live.on .dot { background: var(--good); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs a {
  padding: var(--btn-py) var(--btn-px);
  min-height: var(--target);
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none;
  color: var(--fg-dim);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  font-size: calc(14px * var(--text-scale));
}
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { font-size: calc(11px * var(--text-scale)); background: var(--panel-2); border-radius: 9px; padding: 0 6px; color: var(--fg-dim); }
.tabs .count.issue { color: var(--bad); border: 1px solid var(--bad); background: none; font-weight: 600; }
.issue-line { color: var(--bad); font-weight: 600; }
.map-input { flex: 1 1 14em; min-width: 0; }
/* A full install path in this message must wrap on a phone, not widen the page. */
td.neg { color: var(--bad); font-weight: 600; }
td.strong { font-weight: 700; }
.link-btn { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.link-btn:focus-visible { outline: 2px solid var(--accent); }
.link-btn.small { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); }
.type-cell { white-space: normal; min-width: 9em; color: var(--fg-dim); }
.pips { display: inline-flex; gap: 2px; }
.pip { display: inline-grid; place-items: center; width: 1.35em; height: 1.35em; border-radius: 50%; font-size: calc(11px * var(--text-scale)); font-weight: 700; border: 1px solid var(--border-strong); color: #111; }
.pip-W { background: #f8f3d8; } .pip-U { background: #b7d8f0; } .pip-B { background: #c9c2bf; } .pip-R { background: #f2b8a2; } .pip-G { background: #a9d6b5; } .pip-C { background: #dcdcdc; }
.view-switch { min-width: 13em; }
#game-button:not(:disabled) { color: var(--accent); border-color: var(--selected-border); font-weight: 600; }
.setup h3 { margin: var(--section-gap) 0 var(--block); }
.setup-on { color: var(--good); }
.setup-off { color: var(--warn); }
.setup .list-plain li { flex-wrap: wrap; }
.wrap-code, .snippet { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: calc(12px * var(--text-scale)); overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
.snippet { flex: 1 1 auto; margin: 0; background: var(--panel-2); padding: 6px 8px; border-radius: 4px; }
.lookup-id { width: 9em; }
/* The steps scroll inside the panel so its title and close button stay in view. */
.setup { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
.queue .toolbar { margin-bottom: 4px; }
.cannot-start { color: var(--warn); font-weight: 600; flex: 1 1 100%; min-width: 0; overflow-wrap: anywhere; }
.pill.kind-inventory, .pill.kind-login { color: var(--good); border-color: var(--good); }
.pill.kind-not-read { color: var(--warn); border-color: var(--warn); font-weight: 600; }
.pill.kind-warning { color: var(--bad); border-color: var(--bad); font-weight: 600; }
tr.suspicious td { background: var(--hover); }
.pill.rarity-mythic { color: var(--bad); border-color: var(--bad); font-weight: 600; }
.pill.rarity-rare { color: var(--warn); border-color: var(--warn); font-weight: 600; }
.inline-checks { border: 0; margin: 0; padding: 0; display: inline-flex; flex-wrap: wrap; gap: var(--gap); }
.inline-checks label { display: inline-flex; align-items: center; gap: 4px; text-transform: capitalize; }
tr.suspicious td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.log-tail {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: calc(12px * var(--text-scale));
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: var(--card-p); margin: 0; max-height: 28rem; overflow: auto; white-space: pre;
}

main { padding: var(--section-gap) 0; flex: 1 0 auto; min-width: 0; }
h2 { font-size: calc(17px * var(--text-scale)); margin: 0 0 var(--block); }
h3 { font-size: calc(15px * var(--text-scale)); margin: var(--section-gap) 0 var(--block); }
p { margin: 0 0 var(--block); }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center; margin-bottom: var(--block); }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; }
.toolbar input[type="search"] { width: min(280px, 100%); }
.toolbar input[type="number"] { width: 5.5em; }
.notice { padding: var(--card-p); background: var(--panel); border: 1px dashed var(--border-strong); border-radius: 8px; color: var(--fg-dim); }

/* Tables scroll inside themselves; the page never scrolls sideways. */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: calc(13px * var(--text-scale)); }
th, td { padding: var(--cell-py) var(--cell-px); border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { background: var(--panel-2); font-weight: 600; position: sticky; top: 0; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:focus-visible { outline: 2px solid var(--accent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.notes { white-space: normal; min-width: 14em; max-width: 28em; color: var(--fg-dim); }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--hover); }
tbody tr.selected { background: var(--hover); box-shadow: inset 3px 0 0 var(--selected-border); }
.login { font-weight: 600; white-space: nowrap; }
.login.fresh { color: var(--good); }
.login.aging { color: var(--warn); }
.login.old { color: var(--bad); }
.login.never { color: var(--never); font-weight: 400; font-style: italic; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: calc(12px * var(--text-scale)); }
.pill { display: inline-block; font-size: calc(11px * var(--text-scale)); border: 1px solid var(--border-strong); border-radius: 9px; padding: 0 7px; color: var(--fg-dim); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gap); margin-bottom: var(--section-gap); }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: var(--card-p); }
.tile .label { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); }
.tile .value { font-size: calc(24px * var(--text-scale)); font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: var(--section-gap); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: var(--card-p); min-width: 0; }
.card h3 { margin-top: 0; }
.stack > * + * { margin-top: var(--block); }
.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { padding: var(--cell-py) 0; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.list-plain li:last-child { border-bottom: 0; }
.code-line { display: flex; gap: 6px; align-items: center; margin-top: 4px; width: 100%; }
.code-line code { flex: 1 1 auto; min-width: 0; overflow-x: auto; white-space: pre; background: var(--panel-2); padding: 3px 6px; border-radius: 4px; font-size: calc(12px * var(--text-scale)); }
details > summary { cursor: pointer; padding: var(--cell-py) 0; }
.deck summary { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.deck .cards { columns: 2 14em; font-size: calc(12px * var(--text-scale)); margin: var(--block) 0; padding-left: 0; list-style: none; }
.deck .cards li { break-inside: avoid; }
.back { margin-bottom: var(--block); }

/* Card gallery: images at the card's own proportions (488 × 680), placeholders the same size. */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--gap); }
.gallery-item { margin: 0; min-width: 0; }
.gallery-item figcaption { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gallery-open { all: unset; cursor: pointer; display: block; position: relative; width: 100%; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%; overflow: hidden; }
.gallery-open:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gallery-open img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-ph { box-sizing: border-box; width: 100%; height: 100%; border: 2px dashed var(--border-strong); border-radius: inherit; background: var(--panel-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; text-align: center; overflow: hidden;
  font-size: calc(12px * var(--text-scale)); overflow-wrap: anywhere; }
.card-ph .small { font-size: calc(11px * var(--text-scale)); }
.copies-badge { position: absolute; right: 6px; bottom: 6px; background: var(--panel); color: var(--fg); border: 1px solid var(--border-strong); border-radius: 9px; padding: 0 7px; font-size: calc(12px * var(--text-scale)); font-weight: 700; }
.thumb-cell { width: 1%; padding-top: 3px; padding-bottom: 3px; }
.thumb { all: unset; cursor: pointer; display: block; width: 40px; aspect-ratio: 488 / 680; border-radius: 3px; overflow: hidden; }
.thumb:focus-visible { outline: 2px solid var(--accent); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-ph { display: grid; place-items: center; width: 100%; height: 100%; box-sizing: border-box; border: 1px dashed var(--border-strong); background: var(--panel-2); color: var(--fg-dim); font-size: calc(11px * var(--text-scale)); }
.dialog-card { display: block; width: min(244px, 60%); margin: 0 auto var(--block); border-radius: 4.75% / 3.5%; }
.copies-badge.four { background: var(--accent); color: var(--panel); border-color: var(--accent); }

/* Footer: pushed to the foot of the page when the content is short. */
.build-info {
  margin-top: auto;
  padding: 18px 0 10px;
  font-size: calc(12px * var(--text-scale));
  line-height: 1.5;
  color: var(--fg-dim);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  min-width: 0;
}
.changelog-trigger {
  display: block;
  width: 100%;
  margin-top: 0.35rem;
  padding: 0;
  min-height: 0;
  border: none;
  background: none;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  /* One line only: the full text lives in the dialog. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.changelog-trigger:hover:not(:disabled), .changelog-trigger:focus-visible { color: var(--fg); background: none; }

/* Dialogs */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; z-index: 50; }
.sheet { background: var(--panel); color: var(--fg); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow); width: min(620px, 100%); padding: var(--card-p); max-height: 80vh; max-height: 80dvh; display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: var(--block); }
.sheet-title { margin: 0; font-size: calc(17px * var(--text-scale)); }
.changelog-list {
  margin: 0;
  padding-left: 1.1rem;
  font-size: calc(13px * var(--text-scale));
  line-height: 1.6;
  /* A long changelog scrolls inside the panel rather than growing it. */
  max-height: 28rem;
  overflow-y: auto;
}
.changelog-list li { margin-bottom: 7px; }

/* Command palette */
.palette-scrim { padding-top: 12vh; }
.palette { background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow); width: min(640px, 100%); display: flex; flex-direction: column; overflow: hidden; }
.palette input { border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 12px 14px; font-size: calc(15px * var(--text-scale)); background: var(--panel); width: 100%; }
.palette input:focus-visible { outline: none; }
.palette ul { list-style: none; margin: 0; padding: 4px; overflow-y: auto; max-height: min(420px, 60vh); max-height: min(420px, 60dvh); }
.palette li { display: flex; align-items: center; gap: 10px; padding: var(--btn-py) 10px; border-radius: 6px; cursor: pointer; min-height: max(30px, var(--target)); }
.palette li.active { background: var(--hover); box-shadow: inset 2px 0 0 var(--selected-border); }
.palette li[aria-disabled="true"] { opacity: 0.5; cursor: default; }
.palette .p-group { font-size: calc(11px * var(--text-scale)); color: var(--fg-dim); min-width: 5.5em; flex: none; text-transform: uppercase; letter-spacing: 0.03em; }
.palette .p-main { flex: 1 1 auto; min-width: 0; }
.palette .p-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

}

/* Settings menu */
.settings { position: relative; }

.segmented { display: flex; }

/* The radio stays in the page for keyboard and screen readers; the span is what shows. */
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.segmented span {
  flex: 1 1 auto; display: grid; place-items: center; min-height: var(--target);
  padding: var(--btn-py) 4px; border: 1px solid var(--border-strong); background: var(--panel-2); cursor: pointer;

.segmented label + label span { border-left-width: 0; }

.segmented label:last-child span { border-radius: 0 5px 5px 0; }
.segmented input:checked + span { color: var(--accent); background: var(--hover); border-color: var(--selected-border); font-weight: 600; }
.segmented input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }

.screen-info { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); border-top: 1px solid var(--border); padding-top: var(--block); }

@media (max-width: 600px) {

<script>window.MTGA_CONFIG = /*CONFIG*/null; window.MTGA_DATA = /*DATA*/null;</script>

<!-- Pure helpers: no DOM, no browser APIs. The unit tests run this block in Node. -->
<script id="pure">
var MtgaPure = (function () {
  "use strict";

  /** One changelog entry per line, oldest first; blank lines and \r dropped. */
  function parseChangelog(text) {
    return String(text || "").split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
  }

  /** Every term must occur in group or label; labels starting with the whole query come first. */
  function filterCommands(commands, query) {
    var q = String(query || "").trim().toLowerCase();
    if (!q) return commands.slice();
    var terms = q.split(/\s+/);
    var hits = commands.filter(function (c) {
      var hay = (c.group + " " + c.label).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    });
    var leading = hits.filter(function (c) { return c.label.toLowerCase().indexOf(q) === 0; });
    return leading.concat(hits.filter(function (c) { return leading.indexOf(c) < 0; }));
  }

  /** The searchable text of an account, one field per line. Same fields as Queries.Matches on the server. */
  function accountText(a) {
    return [a.email, a.displayName, a.status, a.notes, a.miscNotes].filter(Boolean).join("\n");
  }

  /** The one account matcher, shared by the table filter and the palette: every term, case-insensitive. */
  function matchesAccount(a, query) {
    var terms = String(query || "").toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return true;
    var hay = accountText(a).toLowerCase();
    return terms.every(function (t) { return hay.indexOf(t) >= 0; });
  }

  /**
   * The line holding the first search term, stripped of markdown markers and cut to about `width`
   * characters around the match, with an ellipsis on each cut side.
   */
  function snippet(text, query, width) {
    width = width || 80;
    var term = String(query || "").trim().toLowerCase().split(/\s+/)[0] || "";
    var lines = String(text || "").split(/\r?\n/);
    var line = lines[0] || "";
    if (term) {
      for (var i = 0; i < lines.length; i++) {
        if (lines[i].toLowerCase().indexOf(term) >= 0) { line = lines[i]; break; }
      }
    }
    line = line.replace(/^\s*(#{1,6}\s+|>\s*|[-*+]\s+|\d+[.)]\s+)+/, "").replace(/[*_`]+/g, "").trim();
    if (line.length <= width) return line;
    var at = term ? line.toLowerCase().indexOf(term) : 0;
    if (at < 0) at = 0;
    var start = Math.max(0, Math.min(at - Math.floor((width - term.length) / 2), line.length - width));
    var end = Math.min(line.length, start + width);
    return (start > 0 ? "…" : "") + line.slice(start, end).trim() + (end < line.length ? "…" : "");
  }

  /** "3d ago"; null for never. */
  function relativeTime(iso, nowMs) {
    if (!iso) return null;
    var t = Date.parse(iso);
    if (isNaN(t)) return null;
    var s = Math.max(0, Math.round((nowMs - t) / 1000));
    if (s < 60) return "just now";
    var m = Math.round(s / 60); if (m < 60) return m + "m ago";
    var h = Math.round(m / 60); if (h < 48) return h + "h ago";
    var d = Math.round(h / 24); if (d < 60) return d + "d ago";
    var mo = Math.round(d / 30.4); if (mo < 24) return mo + "mo ago";
    return Math.round(d / 365) + "y ago";
  }

  /** fresh ≤7d, aging ≤staleDays, old beyond, never. */
  function loginClass(iso, nowMs, staleDays) {
    if (!iso || isNaN(Date.parse(iso))) return "never";
    var days = (nowMs - Date.parse(iso)) / 86400000;
    return days <= 7 ? "fresh" : days <= staleDays ? "aging" : "old";
  }

  function isStale(iso, nowMs, days) {
    return !iso || isNaN(Date.parse(iso)) || (nowMs - Date.parse(iso)) / 86400000 > days;
  }

  /**
   * The Cards tab's filters, shared by the card list, the by-account view, the Accounts column and each
   * account's Known cards. f: { type: "any"|"creature"|…, ignoreLands: bool, alchemy: "include"|"exclude"|"only" }.
   * A card with no type line (card database not set up) passes the type filters: unknown is not a land.
   */
  function cardMatches(c, f) {
    var types = String(c.types || "").toLowerCase();
    if (f.ignoreLands && /\bland\b/.test(types)) return false;
    if (f.type && f.type !== "any" && types && types.split(/[^a-z]+/).indexOf(f.type) < 0) return false;
    if (f.alchemy === "exclude" && c.alchemy) return false;
    if (f.alchemy === "only" && !c.alchemy) return false;
    return true;
  }

  /** Holders grouped by copies: 4 or more first, then 3, 2, 1. */
  function groupByCopies(holders) {
    var groups = [];
    [4, 3, 2, 1].forEach(function (n) {
      var list = holders.filter(function (hd) { return n === 4 ? hd.copies >= 4 : hd.copies === n; });
      if (list.length) groups.push({ copies: n, holders: list });
    });
    return groups;
  }

  return {
    parseChangelog: parseChangelog, filterCommands: filterCommands, accountText: accountText,
    matchesAccount: matchesAccount, snippet: snippet, relativeTime: relativeTime, loginClass: loginClass, isStale: isStale,
    cardMatches: cardMatches, groupByCopies: groupByCopies,
  };
})();
if (typeof module !== "undefined") module.exports = MtgaPure;
</script>

<script>
(function () {
  "use strict";
  var P = MtgaPure;
  var CFG = window.MTGA_CONFIG || {
    appName: "MtgaDash", version: "0.0.0", buildTime: "", staleDays: 30, readOnly: false, changelog: null,
    keys: { theme: "mtgadash:theme", density: "mtgadash:density", text: "mtgadash:text-size" },
    themes: [{ id: "system", label: "System", tip: "" }], densities: [{ id: "normal", label: "Normal", tip: "" }],
    textSizes: [{ id: "100", label: "100%", tip: "" }],
  };
  var EMBEDDED = window.MTGA_DATA;
  var READ_ONLY = !!EMBEDDED;

  var state = {
    route: { view: "accounts" },
    filter: "",
    status: "",
    sort: { key: "email", dir: 1 },
    staleDays: CFG.staleDays || 30,
    selectedEmail: null,
    data: { accounts: [], totals: null, review: null, statuses: [] },
    ingest: null,
    activity: null,
    activityFilter: "",
    activityAuto: true,
    tail: null,
    cards: null,
    game: null,
    cardsMin: 3,
    cardsView: "card",
    cardFilters: loadCardFilters(),
    deckNames: null,
    cardsSearch: "",
    ownedMin: 3,
    loaded: false,
    detail: null,
    updatedAt: null,
    changelog: [],
  };

  // ---------- DOM helpers: text only, never innerHTML, so log or CSV data cannot inject markup ----------

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else if (k === "dataset") for (var d in v) el.dataset[d] = v[d];
        else el.setAttribute(k, v === true ? "" : v);

    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, child) {
    if (child == null || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(el, c); }); return; }
    el.appendChild(typeof child === "object" ? child : document.createTextNode(String(child)));
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs) {
    var el = document.createElementNS(SVGNS, tag);
    for (var k in attrs || {}) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function fmt(n) { return n == null ? "—" : Number(n).toLocaleString("en-US"); }
  function localTime(iso) { return iso ? new Date(iso).toLocaleString() : "never"; }

  var storage = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) {
      try { if (v == null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch (e) { /* the choice lasts for this tab */ }
    },
  };

  function copyText(text, button) {
    function done() {
      if (!button) return;
      var old = button.textContent;
      button.textContent = "Copied";
      setTimeout(function () { button.textContent = old; }, 1200);
    }
    // The clipboard API needs a secure context; over plain-HTTP LAN access fall back to execCommand.
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
    } else { legacyCopy(text); done(); }
  }
  function legacyCopy(text) {
    var ta = h("textarea", { style: "position:fixed;opacity:0;top:0;left:0" });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) { /* nothing more to try */ }
    ta.remove();
  }

  // ---------- Data ----------

  function api(path) {
    return fetch(path, { headers: { Accept: "application/json" } }).then(function (r) {
      if (!r.ok) throw new Error(path + " → " + r.status);
      return r.json();
    });
  }

  function load() {
    if (READ_ONLY) {
      state.data = { accounts: EMBEDDED.accounts || [], totals: EMBEDDED.totals, review: EMBEDDED.review, statuses: EMBEDDED.statuses || [] };
      state.cards = EMBEDDED.cards || null;
      applyOwnedCounts();
      state.loaded = true;
      state.updatedAt = EMBEDDED.generatedAtUtc;
      render();
      return Promise.resolve();
    }
    return Promise.all([api("/api/accounts"), api("/api/totals"), api("/api/review"), api("/api/statuses"), api("/api/status"), api(cardsUrl())]).then(function (r) {
      state.data = { accounts: r[0], totals: r[1], review: r[2], statuses: r[3] };
      state.ingest = r[4];
      state.cards = r[5];
      loadGame();
      applyOwnedCounts();
      state.loaded = true;
      state.updatedAt = new Date().toISOString();
      if (state.route.view === "account") return loadDetail(state.route.email);
    }).then(render, function (err) {
      state.loadError = String(err && err.message || err);
      render();
    });
  }

  function loadDetail(email) {
    if (READ_ONLY) {
      state.detail = (EMBEDDED.details || {})[email] || null;
      return Promise.resolve();
    }
    return api("/api/accounts/" + encodeURIComponent(email)).then(function (d) { state.detail = d; }, function () { state.detail = null; });
  }

  function connectLive() {
    var live = document.getElementById("live");
    var text = document.getElementById("live-text");
    if (READ_ONLY || !window.EventSource) {
      text.textContent = READ_ONLY ? "snapshot" : "no live updates";
      return;
    }
    var es = new EventSource("/api/events");
    es.addEventListener("open", function () { live.classList.add("on"); text.textContent = "live"; });
    es.addEventListener("error", function () { live.classList.remove("on"); text.textContent = "reconnecting"; });
    es.addEventListener("changed", function () { load(); });
  }

  // ---------- Routing ----------

  function parseRoute() {
    var hsh = location.hash.replace(/^#\/?/, "");
    if (hsh.indexOf("account/") === 0) return { view: "account", email: decodeURIComponent(hsh.slice(8)) };
    return { view: VIEWS.some(function (v) { return v.id === hsh; }) ? hsh : "accounts" };
  }
  function go(view, email) {
    var target = view === "account" ? "#/account/" + encodeURIComponent(email) : "#/" + view;
    if (location.hash === target) onRoute(); else location.hash = target;
  }
  function onRoute() {
    state.route = parseRoute();
    if (state.route.view === "account") {
      state.selectedEmail = state.route.email;
      state.detail = undefined;
      render();
      loadDetail(state.route.email).then(render);
    } else {
      render();
      if (state.route.view === "activity") loadActivity();
    }
  }

  // ---------- Views ----------

  var VIEWS = [
    { id: "accounts", label: "Accounts", key: "1" },
    { id: "stale", label: "Stale", key: "2" },
    { id: "totals", label: "Totals", key: "3" },
    { id: "review", label: "Review", key: "4" },
    { id: "status", label: "Status", key: "5" },
    { id: "activity", label: "Activity", key: "6" },
    { id: "cards", label: "Cards", key: "7" },
  ].filter(function (v) { return !(READ_ONLY && (v.id === "status" || v.id === "activity")); }); // the export has no ingestion to report on

  function filteredAccounts() {
    return state.data.accounts.filter(function (a) {
      return P.matchesAccount(a, state.filter) && (!state.status || (a.status || "") === state.status);
    });
  }
  function staleAccounts() {
    var now = Date.now();
    return state.data.accounts.filter(function (a) { return P.isStale(a.lastLoginUtc, now, state.staleDays); })
      .sort(function (a, b) { return (a.lastLoginUtc || "").localeCompare(b.lastLoginUtc || "") || a.email.localeCompare(b.email); });
  }
  function reviewCount() {
    var r = state.data.review;
    return r ? r.unmatched.length + r.ambiguous.length + r.statusMismatches.length + (r.drops || []).length : 0;
  }

  function render() {
    renderTabs();
    renderSearchBox();
    var upd = document.getElementById("updated");
    upd.textContent = state.updatedAt ? "updated " + new Date(state.updatedAt).toLocaleTimeString() : "";
    var view = document.getElementById("view");
    var scrollY = window.scrollY;
    var focusedId = document.activeElement && document.activeElement.id;
    var focusedSel = document.activeElement && document.activeElement.selectionStart;
    view.replaceChildren();
    if (state.loadError && !state.loaded) {
      view.appendChild(h("p", { class: "notice", text: "Could not load data: " + state.loadError }));
      return;
    }
    if (!state.loaded) { view.appendChild(h("p", { class: "muted", text: "Loading…" })); return; }
    var r = state.route.view;
    if (r === "accounts") renderAccounts(view);
    else if (r === "stale") renderStale(view);
    else if (r === "totals") renderTotals(view);
    else if (r === "review") renderReview(view);
    else if (r === "status") renderStatus(view);
    else if (r === "activity") renderActivity(view);
    else if (r === "cards") renderCards(view);
    else if (r === "account") renderDetail(view);
    // Re-rendering on a live update must not steal the caret from a filter box or jump the page.
    if (focusedId) {
      var el = document.getElementById(focusedId);
      if (el && el !== document.activeElement && view.contains(el)) {
        el.focus();
        if (focusedSel != null && el.setSelectionRange) try { el.setSelectionRange(focusedSel, focusedSel); } catch (e) { /* not a text field */ }
      }
    }
    window.scrollTo(0, scrollY);
  }

  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.replaceChildren();
    var counts = { accounts: state.data.accounts.length, stale: staleAccounts().length, review: reviewCount() };
    var issues = state.ingest ? state.ingest.issues.length : 0;
    VIEWS.forEach(function (v) {
      var current = state.route.view === v.id || (v.id === "accounts" && state.route.view === "account");
      nav.appendChild(h("a", { href: "#/" + v.id, "aria-current": current ? "page" : null, title: v.label + " (" + v.key + ")" },
        v.label, counts[v.id] != null && state.loaded ? h("span", { class: "count", text: fmt(counts[v.id]) }) : null,
        v.id === "status" && issues ? h("span", { class: "count issue", title: issues + " issues", text: "!" + issues }) : null));
    });
  }

  function renderSearchBox() {
    var box = document.getElementById("search-box");
    var text = document.getElementById("palette-trigger-text");
    var trigger = document.getElementById("palette-trigger");
    var clear = document.getElementById("search-clear");
    var active = !!state.filter;
    box.classList.toggle("has-filter", active);
    trigger.classList.toggle("filtered", active);
    text.textContent = active ? state.filter : "Search or run a command…";
    clear.hidden = !active;
  }

  function setFilter(q) {
    state.filter = q;
    render();
  }

  function loginCell(a) {
    var now = Date.now();
    var cls = P.loginClass(a.lastLoginUtc, now, state.staleDays);
    return h("span", { class: "login " + cls, title: localTime(a.lastLoginUtc) }, P.relativeTime(a.lastLoginUtc, now) || "never");
  }

  var COLUMNS = [
    { key: "email", label: "Email" },
    { key: "displayName", label: "Display name" },
    { key: "status", label: "Status" },
    { key: "lastLoginUtc", label: "Last login" },
    { key: "gems", label: "Gems", num: true },
    { key: "gold", label: "Gold", num: true },
    { key: "wcRare", label: "R", num: true, title: "Rare wildcards" },
    { key: "wcMythic", label: "M", num: true, title: "Mythic wildcards" },
    { key: "boosterTotal", label: "Boosters", num: true },
    { key: "customDeckCount", label: "Decks", num: true, title: "Custom (non-precon) decks" },
    { key: "ownedCount", label: ownedLabel, num: true, title: "Cards known to be owned at this many copies or more, from saved decks (a minimum). Set on the Cards tab." },
    { key: "notes", label: "Notes" },

  function sortRows(rows) {
    var k = state.sort.key, dir = state.sort.dir;

      var x = a[k], y = b[k];
      // Missing values sort last in either direction.
      if (x == null && y == null) return a.email.localeCompare(b.email);
      if (x == null) return 1;
      if (y == null) return -1;
      var c = typeof x === "number" ? x - y : String(x).localeCompare(String(y), undefined, { sensitivity: "base" });

    });
  }

  function setSort(key) {
    if (state.sort.key === key) state.sort.dir = -state.sort.dir;
    else state.sort = { key: key, dir: key === "email" || key === "displayName" || key === "status" || key === "notes" ? 1 : -1 };
    render();
  }

  function renderAccounts(view) {
    var rows = sortRows(filteredAccounts());
    var statusSelect = h("select", { id: "status-filter", "aria-label": "Status", onchange: function (e) { state.status = e.target.value; render(); } },
      h("option", { value: "", text: "All statuses" }),

  function openDialog(title, content, onClosed) {

    var closeBtn = h("button", { type: "button", "aria-label": "Close", text: "✕" });
    var sheet = h("div", { class: "sheet" }, h("div", { class: "sheet-head" }, h("h2", { class: "sheet-title", text: title }), closeBtn), content);
    var scrim = h("div", { class: "scrim", role: "dialog", "aria-modal": "true", "aria-label": title }, sheet);
    function close() {
      document.removeEventListener("keydown", onKey, true);
      scrim.remove();
      document.body.style.overflow = oldOverflow;
      if (previous && previous.focus) previous.focus();
      if (onClosed) onClosed();
    }
    function onKey(e) { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); } }
    // Close only on a click that landed on the backdrop itself: a click inside the panel (selecting text,
    // scrolling the list) bubbles up here too and must not dismiss it.
    scrim.addEventListener("click", function (e) { if (e.target === e.currentTarget) close(); });
    closeBtn.addEventListener("click", close);
    document.addEventListener("keydown", onKey, true);
    document.body.style.overflow = "hidden";
    document.body.appendChild(scrim);
    closeBtn.focus();
    return close;

    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
      var media = m.getAttribute("media") || "";
      m.setAttribute("content", t && t.color ? t.color : media.indexOf("dark") >= 0 ? DEFAULT_COLORS.dark : DEFAULT_COLORS.light);
    });
  }
  function applyDensity(id) { var d = document.documentElement; if (id === CFG.densities[0].id) delete d.dataset.density; else d.dataset.density = id; }
  function applyTextSize(id) { var d = document.documentElement; if (id === CFG.textSizes[0].id) delete d.dataset.text; else d.dataset.text = id; }

  function saved(list, key) {
    var v = storage.get(key);
    return list.some(function (x) { return x.id === v; }) ? v : list[0].id;
  }
  // The boot script already applied these; read them back only to show the controls' state.
  var display = {
    theme: saved(CFG.themes, CFG.keys.theme),
    density: saved(CFG.densities, CFG.keys.density),
    text: saved(CFG.textSizes, CFG.keys.text),
  };
  function chooseTheme(id) { display.theme = id; applyTheme(id); storage.set(CFG.keys.theme, id === CFG.themes[0].id ? null : id); syncSettings(); }
  function chooseDensity(id) { display.density = id; applyDensity(id); storage.set(CFG.keys.density, id === CFG.densities[0].id ? null : id); syncSettings(); }
  function chooseText(id) { display.text = id; applyTextSize(id); storage.set(CFG.keys.text, id === CFG.textSizes[0].id ? null : id); syncSettings(); }

  var settingsPanel = null;
  function syncSettings() {
    if (!settingsPanel) return;
    settingsPanel.querySelectorAll("input[type=radio]").forEach(function (r) { r.checked = display[r.name] === r.value; });
    var tip = settingsPanel.querySelector("#density-tip");
    if (tip) tip.textContent = CFG.densities.filter(function (d) { return d.id === display.density; })[0].tip;
  }
  function segmented(name, legend, list, choose) {
    return h("fieldset", null, h("legend", { text: legend }),
      h("div", { class: "segmented" }, list.map(function (c) {
        return h("label", { title: c.tip },
          h("input", { type: "radio", name: name, value: c.id, checked: display[name] === c.id, onchange: function () { choose(c.id); } }),
          h("span", { text: c.label }));
      })),
      name === "density" ? h("div", { class: "seg-tip", id: "density-tip" }) : null);
  }
  function toggleSettings(force) {
    var open = force != null ? force : !settingsPanel;
    var button = document.getElementById("settings-button");
    if (!open) {
      if (settingsPanel) { settingsPanel.remove(); settingsPanel = null; }
      button.setAttribute("aria-expanded", "false");
      document.removeEventListener("pointerdown", onOutside, true);
      window.removeEventListener("resize", updateScreen);
      return;
    }
    if (settingsPanel) return;
    settingsPanel = h("div", { id: "settings-panel", class: "settings-panel", role: "dialog", "aria-label": "Display settings" },
      h("fieldset", null, h("legend", { text: "Theme" }), CFG.themes.map(function (t) {
        return h("label", { class: "choice" },
          h("input", { type: "radio", name: "theme", value: t.id, checked: display.theme === t.id, onchange: function () { chooseTheme(t.id); } }),
          h("span", { text: t.label }), h("small", { text: t.tip }));
      })),
      segmented("density", "Density", CFG.densities, chooseDensity),
      segmented("text", "Text size", CFG.textSizes, chooseText),
      h("div", { class: "screen-info", id: "screen-info" }));
    document.getElementById("settings").appendChild(settingsPanel);
    button.setAttribute("aria-expanded", "true");
    syncSettings();
    updateScreen();
    var checked = settingsPanel.querySelector("input:checked");
    if (checked) checked.focus();
    document.addEventListener("pointerdown", onOutside, true);
    window.addEventListener("resize", updateScreen);
  }
  function onOutside(e) { if (!document.getElementById("settings").contains(e.target)) toggleSettings(false); }
  function updateScreen() {
    var el = document.getElementById("screen-info");
    if (el) el.textContent = "This screen: " + window.innerWidth + " × " + window.innerHeight + " CSS pixels at " + (Math.round(window.devicePixelRatio * 100) / 100) + "×";
  }

  // ---------- Command palette ----------

  function buildCommands() {
    var detail = state.route.view === "account";
    var email = currentEmail();
    var cmds = [];
    VIEWS.forEach(function (v) {
      cmds.push({ id: "view-" + v.id, group: "View", label: "Go to " + v.label, hotkey: v.key, disabled: state.route.view === v.id, run: function () { go(v.id); } });
    });
    cmds.push({ id: "back", group: "View", label: "Back to accounts", hotkey: "Esc", disabled: !detail, run: function () { go("accounts"); } });
    cmds.push({ id: "copy-email", group: "Account", label: email ? "Copy email: " + email : "Copy email of the current account", hotkey: "C", disabled: !email, run: function () { copyText(email); } });
    cmds.push({ id: "open-selected", group: "Account", label: "Open the selected account", disabled: !state.selectedEmail || detail, run: function () { go("account", state.selectedEmail); } });
    cmds.push({ id: "focus-filter", group: "Table", label: "Filter the accounts table", hotkey: "F", run: focusTableFilter });
    cmds.push({ id: "clear-filter", group: "Table", label: "Clear the filter", disabled: !state.filter, run: function () { setFilter(""); } });
    cmds.push({ id: "all-statuses", group: "Table", label: "Show all statuses", disabled: !state.status, run: function () { state.status = ""; render(); } });
    [["lastLoginUtc", "last login"], ["gems", "gems"], ["gold", "gold"], ["wcRare", "rare wildcards"], ["wcMythic", "mythic wildcards"], ["customDeckCount", "custom decks"], ["boosterTotal", "boosters"], ["ownedCount", "owned cards at the Cards tab's copies"], ["email", "email"]].forEach(function (p) {
      cmds.push({ id: "sort-" + p[0], group: "Table", label: "Sort by " + p[1] + (state.sort.key === p[0] ? (state.sort.dir > 0 ? ": switch to descending" : ": switch to ascending") : ""), run: function () { go("accounts"); setSort(p[0]); } });
    });
    var nextUp = queue()[0];
    cmds.push({ id: "queue-next", group: "Queue", label: nextUp ? "Copy the next account to log in: " + nextUp.email : "Copy the next account to log in (queue empty)", hotkey: "N", disabled: !nextUp, run: function () { nextInQueue(true); } });
    cmds.push({ id: "queue-skip", group: "Queue", label: "Skip the next account in the queue", disabled: !nextUp, run: function () { nextInQueue(false); } });
    cmds.push({ id: "queue-reset", group: "Queue", label: "Reset today's login queue", disabled: !handedOut().length, run: resetQueue });
    cmds.push({ id: "copy-stale", group: "Stale", label: "Copy all stale emails (" + staleAccounts().length + ")", disabled: !staleAccounts().length, run: function () { copyText(staleAccounts().map(function (a) { return a.email; }).join("\n")); } });
    cmds.push({ id: "refresh", group: "Data", label: "Refresh now", hotkey: "R", disabled: READ_ONLY, run: load });
    cmds.push({ id: "reimport", group: "Data", label: "Re-import the accounts CSV", disabled: READ_ONLY, run: reimport });
    cmds.push({ id: "export", group: "Export", label: "Write the static export", disabled: READ_ONLY, run: exportNow });
    cmds.push({ id: "settings", group: "Settings", label: "Open display settings", run: function () { toggleSettings(true); } });
    CFG.themes.forEach(function (t) { cmds.push({ id: "theme-" + t.id, group: "Settings", label: "Theme: " + t.label + (display.theme === t.id ? " (in use)" : ""), disabled: display.theme === t.id, run: function () { chooseTheme(t.id); } }); });
    CFG.densities.forEach(function (d) { cmds.push({ id: "density-" + d.id, group: "Settings", label: "Density: " + d.label + (display.density === d.id ? " (in use)" : ""), disabled: display.density === d.id, run: function () { chooseDensity(d.id); } }); });
    CFG.textSizes.forEach(function (t) { cmds.push({ id: "text-" + t.id, group: "Settings", label: "Text size: " + t.label + (display.text === t.id ? " (in use)" : ""), disabled: display.text === t.id, run: function () { chooseText(t.id); } }); });
    cmds.push({ id: "cardimages-download", group: "Cards", label: "Download missing card images", disabled: READ_ONLY || (state.imageStatus && state.imageStatus.running), run: startImageDownload });
    cmds.push({ id: "carddb-setup", group: "Cards", label: "Set up card names (CardDbPath)", disabled: READ_ONLY, run: openCardDbSetup });
    cmds.push({ id: "game-launch", group: "Game", label: state.game && state.game.running ? "Start MTGA (already running)" : "Start MTGA",
      disabled: READ_ONLY || !state.game || state.game.running || !state.game.canLaunch, run: launchGame });
    cmds.push({ id: "status-refresh", group: "Status", label: "Refresh ingestion status", disabled: READ_ONLY, run: refreshStatus });
    [1, 2, 3, 4].forEach(function (n) {
      cmds.push({ id: "cards-min-" + n, group: "Cards", label: "Show cards held at " + n + "+ copies", disabled: READ_ONLY || state.cardsMin === n, run: function () { go("cards"); setCardsMin(n); } });
    });
    [["card", "By card"], ["account", "By account"]].forEach(function (v) {
      cmds.push({ id: "cards-view-" + v[0], group: "Cards", label: "Cards: view " + v[1].toLowerCase(), disabled: state.cardsView === v[0] && state.route.view === "cards", run: function () { state.cardsView = v[0]; go("cards"); } });
    });
    CARD_TYPES.forEach(function (t) {
      cmds.push({ id: "cards-type-" + t, group: "Cards", label: "Cards: type " + (t === "any" ? "any" : t), disabled: state.cardFilters.type === t, run: function () { go("cards"); setCardFilter("type", t); } });
    });
    cmds.push({ id: "cards-lands", group: "Cards", label: "Cards: ignore lands: " + (state.cardFilters.ignoreLands ? "turn off" : "turn on"), run: function () { go("cards"); setCardFilter("ignoreLands", !state.cardFilters.ignoreLands); } });
    [["include", "include Alchemy cards"], ["exclude", "exclude Alchemy cards"], ["only", "only Alchemy cards"]].forEach(function (o) {
      cmds.push({ id: "cards-alchemy-" + o[0], group: "Cards", label: "Cards: " + o[1], disabled: state.cardFilters.alchemy === o[0], run: function () { go("cards"); setCardFilter("alchemy", o[0]); } });
    });
    cmds.push({ id: "activity-refresh", group: "Activity", label: "Refresh activity", disabled: READ_ONLY, run: function () { go("activity"); loadActivity(); } });
    cmds.push({ id: "activity-auto", group: "Activity", label: "Auto-refresh every 3 s: " + (state.activityAuto ? "turn off" : "turn on"), disabled: READ_ONLY, run: toggleActivityAuto });
    cmds.push({ id: "activity-tail", group: "Activity", label: "Show the last lines of the live log", disabled: READ_ONLY, run: function () { go("activity"); loadTail("", 60); } });
    var rv = state.data.review;
    if (rv && !READ_ONLY) {
      rv.ambiguous.forEach(function (a) {
        a.candidates.forEach(function (email) {
          cmds.push({ id: "map-" + a.displayName + "-" + email, group: "Review", label: "Map " + a.displayName + " to " + email, run: function () { saveMapping(a.displayName, email); } });
        });
      });
      (rv.mappings || []).filter(function (m) { return m.source === "file"; }).forEach(function (m) {
        cmds.push({ id: "unmap-" + m.displayName, group: "Review", label: "Remove the mapping for " + m.displayName, run: function () { removeMapping(m.displayName); } });
      });
    }
    cmds.push({ id: "changelog", group: "Help", label: "Show the changelog", disabled: !state.changelog.length, run: openChangelog });
    return cmds;
  }

  function searchItems(query) {
    var q = query.trim();
    var hits = state.data.accounts.filter(function (a) { return P.matchesAccount(a, q); });
    var items = [];
    if (hits.length) {
      items.push({ id: "show-only", group: "Filter", label: "Show only the " + hits.length + " accounts matching '" + q + "'", run: function () { state.filter = q; go("accounts"); } });
    }
    hits.slice(0, 50).forEach(function (a) {
      items.push({
        id: "acct-" + a.email, group: "Account", label: a.email + (a.displayName ? " · " + a.displayName : ""), item: true,
        snippet: P.snippet(P.accountText(a), q, 80),
        run: function () { state.selectedEmail = a.email; state.didScrollSelected = false; go("account", a.email); },
      });
    });
    return items;
  }

  var palette = null;
  function openPalette(seed) {
    if (palette) { palette.input.focus(); palette.input.select(); return; }
    toggleSettings(false);
    var previous = document.activeElement;
    var commands = buildCommands();
    var query = seed || "";
    var active = 0;
    var shown = [];
    var input = h("input", {
      type: "text", value: query, placeholder: "Search or run a command…", "aria-label": "Search and commands",
      "aria-controls": "palette-list", autocomplete: "off", spellcheck: "false", role: "combobox", "aria-expanded": "true",
    });
    var list = h("ul", { id: "palette-list", role: "listbox", "aria-label": "Commands and accounts" });
    var box = h("div", { class: "palette", role: "dialog", "aria-label": "Command palette" }, input, list);
    var scrim = h("div", { class: "scrim palette-scrim" }, box);

    function compute() {
      var cmds = P.filterCommands(commands, query);
      shown = cmds.concat(query.trim() ? searchItems(query) : []);
    }
    function draw() {
      list.replaceChildren();
      if (!shown.length) list.appendChild(h("li", { class: "p-empty", role: "option", "aria-disabled": "true", text: "No command or account matches." }));
      var sawItem = false;
      shown.forEach(function (c, i) {
        if (c.item && !sawItem) { sawItem = true; list.appendChild(h("li", { class: "p-sep", role: "presentation", text: "Accounts" })); }
        list.appendChild(h("li", {
          id: "cmd-" + i, role: "option", "aria-selected": i === active ? "true" : "false", "aria-disabled": c.disabled ? "true" : null,
          class: i === active ? "active" : null, dataset: { index: String(i) },
          onmousemove: function () { if (active !== i) { active = i; mark(); } },
          onclick: function () { run(c); },
        },
          h("span", { class: "p-group", text: c.group }),
          h("span", { class: "p-main" }, h("span", { class: "p-label", text: c.label }), c.snippet ? h("span", { class: "p-snippet", text: c.snippet }) : null),
          c.hotkey ? h("kbd", { text: c.hotkey }) : null));
      });
      mark();
    }
    function mark() {
      list.querySelectorAll("li[data-index]").forEach(function (li) {
        var on = Number(li.dataset.index) === active;
        li.classList.toggle("active", on);
        li.setAttribute("aria-selected", on ? "true" : "false");
        if (on) li.scrollIntoView({ block: "nearest" });
      });
      if (shown[active]) input.setAttribute("aria-activedescendant", "cmd-" + active); else input.removeAttribute("aria-activedescendant");
    }
    function close() {
      scrim.remove();
      palette = null;
      window.visualViewport && window.visualViewport.removeEventListener("resize", fit);
      if (previous && previous.focus && document.contains(previous)) previous.focus();
    }
    function run(c) {
      if (!c || c.disabled) return;
      close();
      // After the palette is gone, so a command that moves focus keeps it.
      requestAnimationFrame(function () { c.run(); });
    }
    function fit() {
      if (window.visualViewport) document.documentElement.style.setProperty("--vvh", window.visualViewport.height + "px");
    }
    input.addEventListener("input", function () { query = input.value; active = 0; compute(); draw(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); }
      else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var n = shown.length;
        if (n) { active = (active + (e.key === "ArrowDown" ? 1 : n - 1)) % n; mark(); }
      } else if (e.key === "Enter") { e.preventDefault(); run(shown[active]); }
    });
    scrim.addEventListener("mousedown", function (e) { if (e.target === e.currentTarget) close(); });
    palette = { input: input, close: close };
    compute();
    document.body.appendChild(scrim);
    draw();
    fit();
    window.visualViewport && window.visualViewport.addEventListener("resize", fit);
    input.focus();
    input.select();
  }

  // ---------- Global keys ----------

  document.addEventListener("keydown", function (e) {
    var mod = e.ctrlKey || e.metaKey;
    var k = e.key.toLowerCase();
    // Ctrl+K works everywhere, even inside a text field, and reopens on the current filter.
    if (mod && !e.shiftKey && k === "k") { e.preventDefault(); openPalette(state.filter); return; }
    if (mod && e.shiftKey && k === "p") { e.preventDefault(); openPalette(""); return; }
    if (mod || e.altKey || palette) return;
    if (document.querySelector(".scrim")) return;
    if (e.key === "Escape" && settingsPanel) { toggleSettings(false); document.getElementById("settings-button").focus(); return; }
    var typing = e.target && e.target.closest && e.target.closest("input, textarea, select, [contenteditable='true']");
    if (typing) return;
    if (e.key === "/") { e.preventDefault(); openPalette(state.filter); return; }
    if (e.key === "Escape" && state.route.view === "account") { go("accounts"); return; }
    var v = VIEWS.filter(function (x) { return x.key === e.key; })[0];
    if (v) { go(v.id); return; }
    if (k === "r" && !READ_ONLY) { load(); return; }
    if (k === "f") { e.preventDefault(); focusTableFilter(); return; }
    if (k === "c" && currentEmail()) { copyText(currentEmail()); return; }
    if (k === "n" && !READ_ONLY) { nextInQueue(true); return; }
  });

  // ---------- Start ----------

  document.getElementById("palette-trigger").addEventListener("click", function () { openPalette(state.filter); });
  document.getElementById("search-clear").addEventListener("click", function () { setFilter(""); document.getElementById("palette-trigger").focus(); });
  document.getElementById("settings-button").addEventListener("click", function () { toggleSettings(); });
  document.getElementById("game-button").addEventListener("click", launchGame);
  window.addEventListener("hashchange", onRoute);
  if (READ_ONLY) document.title = CFG.appName + " (snapshot)";
  state.route = parseRoute();
  if (state.route.view === "account") state.selectedEmail = state.route.email;
  if (state.route.view === "activity") loadActivity();
  renderFooter();
  loadChangelog();
  load();
  connectLive();
  // Polls run without changing data, so the status (last poll, file sizes) is refreshed on its own.
  if (!READ_ONLY) setInterval(function () { if (!document.hidden) refreshStatus(); }, 15000);
  // The Activity tab changes on every poll, not only when data changes, so it refreshes on its own while open.
  if (!READ_ONLY) setInterval(function () {
    if (!document.hidden && state.route.view === "activity" && state.activityAuto && !document.querySelector(".scrim")) loadActivity();
  }, 3000);
})();
</script>
</body>
</html>
