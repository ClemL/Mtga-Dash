<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MtgaDash</title>
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181d" media="(prefers-color-scheme: dark)">
<!-- Applies saved theme, density and text size before first paint; generated from Web/DisplayOptions.cs. -->
<!--BOOT-->
<style>
/* Every font size is calc(<px> * var(--text-scale)) and the spacing below is what the density setting
   changes; a new rule should use both, or it ignores the Settings menu. */
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #eef0f3;
  --border: #d9dce1;
  --border-strong: #b8bdc6;
  --fg: #1b1f24;
  --fg-dim: #59616d;
  --accent: #1f62c4;
  --hover: #e8eef8;
  --selected-border: #1f62c4;
  --good: #137a2e;
  --warn: #8a5800;
  --bad: #b3261e;
  --never: #626973;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --scrim: rgba(15, 18, 22, 0.45);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.18);

  --text-scale: 1;
  --line: 1.5;
  --gap: 8px;
  --bar-py: 10px;
  --btn-py: 5px;
  --btn-px: 10px;
  --input-py: 5px;
  --cell-py: 6px;
  --cell-px: 8px;
  --card-p: 14px;
  --section-gap: 16px;
  --block: 8px;
  --target: 0px;
}

:root[data-density="compact"] {
  --line: 1.35; --gap: 5px; --bar-py: 6px; --btn-py: 2px; --btn-px: 7px; --input-py: 2px;
  --cell-py: 2px; --cell-px: 6px; --card-p: 9px; --section-gap: 10px; --block: 5px;
}

:root[data-density="cozy"] {
  --line: 1.65; --gap: 11px; --bar-py: 14px; --btn-py: 8px; --btn-px: 14px; --input-py: 8px;
  --cell-py: 10px; --cell-px: 11px; --card-p: 20px; --section-gap: 24px; --block: 12px; --target: 36px;
}

/* Cozy is the setting for fingers: 44px is the smallest comfortable touch target. */
@media (pointer: coarse) {
  :root[data-density="cozy"] { --target: 44px; }
}

:root[data-text="90"] { --text-scale: 0.9; }
:root[data-text="115"] { --text-scale: 1.15; }
:root[data-text="130"] { --text-scale: 1.3; }

/* System (no data-theme) follows the device; an explicit Light keeps the base values above. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    color-scheme: dark;
    --bg: #15181d; --panel: #1d2127; --panel-2: #252a31; --border: #323842; --border-strong: #4a5260;
    --fg: #e6e8eb; --fg-dim: #a4acb8; --accent: #7fb0ff; --hover: #26303d; --selected-border: #7fb0ff;
    --good: #5cc97a; --warn: #e0b341; --bad: #ff8a80; --never: #9aa2ae;
    --series-1: #3987e5; --series-2: #d95926; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15181d; --panel: #1d2127; --panel-2: #252a31; --border: #323842; --border-strong: #4a5260;
  --fg: #e6e8eb; --fg-dim: #a4acb8; --accent: #7fb0ff; --hover: #26303d; --selected-border: #7fb0ff;
  --good: #5cc97a; --warn: #e0b341; --bad: #ff8a80; --never: #9aa2ae;
  --series-1: #3987e5; --series-2: #d95926; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
}

/* True black: an AMOLED screen turns black pixels off. Text is dimmed a step so white does not glare. */
:root[data-theme="oled"] {
  color-scheme: dark;
  --bg: #000000; --panel: #000000; --panel-2: #0a0a0a; --border: #222222; --border-strong: #363636;
  --fg: #c9c9c9; --fg-dim: #8a8a8a; --accent: #6cb6ff; --hover: #111a24; --selected-border: #6cb6ff;
  --good: #4fbf6c; --warn: #d4a72c; --bad: #ff7b72; --never: #8a8a8a;
  --series-1: #3987e5; --series-2: #d95926; --scrim: rgba(0, 0, 0, 0.75); --shadow: 0 0 0 1px #363636;
}

/* Black on white, every border black, links underlined, a thick focus ring: text and controls clear
   WCAG's 7:1 enhanced contrast. */
:root[data-theme="contrast"] {
  color-scheme: light;
  --bg: #ffffff; --panel: #ffffff; --panel-2: #ffffff; --border: #000000; --border-strong: #000000;
  --fg: #000000; --fg-dim: #333333; --accent: #0037a6; --hover: #e6ecff; --selected-border: #000000;
  --good: #0b5a1d; --warn: #5c3b00; --bad: #8c1d18; --never: #3d3d3d;
  --series-1: #0037a6; --series-2: #a33000; --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 0 0 2px #000000;
}
[data-theme="contrast"] :focus-visible { outline: 3px solid var(--accent) !important; outline-offset: 2px; }
[data-theme="contrast"] a { text-decoration: underline; }
/* Inactive controls stay legible: a faded button would fall below 7:1. */
[data-theme="contrast"] button:disabled,
[data-theme="contrast"] .palette li[aria-disabled="true"] { opacity: 1; color: #4a4a4a; border-style: dashed; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: calc(14px * var(--text-scale));
  line-height: var(--line);
  /* Long emails and identifiers break rather than widen the page on a phone at 130%. */
  overflow-wrap: break-word;
}
a { color: var(--accent); }
h2, p { overflow-wrap: anywhere; }
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; max-width: 1400px; margin: 0 auto; padding: 0 16px; }

button, select, input {
  font: inherit;
  font-size: calc(13px * var(--text-scale));
  color: inherit;
}
button {
  background: var(--panel-2);
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  padding: var(--btn-py) var(--btn-px);
  min-height: var(--target);
  cursor: pointer;
}
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: 0.55; cursor: default; }
input, select {
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  padding: var(--input-py) 8px;
  min-height: var(--target);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (hover: none) {
  button, select, input { min-height: max(32px, var(--target)); }
}
kbd {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: calc(11px * var(--text-scale));
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 5px;
  color: var(--fg-dim);
  background: var(--panel);
  white-space: nowrap;
}
.muted { color: var(--fg-dim); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Header */
.bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--gap);
  padding: var(--bar-py) 0;
}
.brand { font-size: calc(18px * var(--text-scale)); margin: 0; font-weight: 700; flex: none; }
/* Takes the free width up to 480px and is the first thing to give it up as the window narrows. */
.search-box {
  flex: 1 1 480px;
  max-width: 480px;
  min-width: 120px;
  display: flex;
  align-items: stretch;
  position: relative;
}
.palette-trigger {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  background: var(--panel);
  color: var(--fg-dim);
  border-radius: 6px;
}
.palette-trigger .pt-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-trigger.filtered .pt-text { color: var(--fg); }
.search-box.has-filter .palette-trigger { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.search-clear { border-left-width: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; flex: none; }
.bar-right { display: flex; align-items: center; gap: var(--gap); margin-left: auto; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 5px; font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); white-space: nowrap; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--never); }
.live.on .dot { background: var(--good); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs a {
  padding: var(--btn-py) var(--btn-px);
  min-height: var(--target);
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none;
  color: var(--fg-dim);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  font-size: calc(14px * var(--text-scale));
}
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { font-size: calc(11px * var(--text-scale)); background: var(--panel-2); border-radius: 9px; padding: 0 6px; color: var(--fg-dim); }
.tabs .count.issue { color: var(--bad); border: 1px solid var(--bad); background: none; font-weight: 600; }
.issue-line { color: var(--bad); font-weight: 600; }
.map-input { flex: 1 1 14em; min-width: 0; }
.pill.kind-inventory, .pill.kind-login { color: var(--good); border-color: var(--good); }
.pill.kind-not-read { color: var(--warn); border-color: var(--warn); font-weight: 600; }
.pill.kind-warning { color: var(--bad); border-color: var(--bad); font-weight: 600; }
tr.suspicious td { background: var(--hover); }
tr.suspicious td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.log-tail {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: calc(12px * var(--text-scale));
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: var(--card-p); margin: 0; max-height: 28rem; overflow: auto; white-space: pre;
}

main { padding: var(--section-gap) 0; flex: 1 0 auto; min-width: 0; }
h2 { font-size: calc(17px * var(--text-scale)); margin: 0 0 var(--block); }
h3 { font-size: calc(15px * var(--text-scale)); margin: var(--section-gap) 0 var(--block); }
p { margin: 0 0 var(--block); }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center; margin-bottom: var(--block); }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; }
.toolbar input[type="search"] { width: min(280px, 100%); }
.toolbar input[type="number"] { width: 5.5em; }
.notice { padding: var(--card-p); background: var(--panel); border: 1px dashed var(--border-strong); border-radius: 8px; color: var(--fg-dim); }

/* Tables scroll inside themselves; the page never scrolls sideways. */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: calc(13px * var(--text-scale)); }
th, td { padding: var(--cell-py) var(--cell-px); border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { background: var(--panel-2); font-weight: 600; position: sticky; top: 0; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:focus-visible { outline: 2px solid var(--accent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.notes { white-space: normal; min-width: 14em; max-width: 28em; color: var(--fg-dim); }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--hover); }
tbody tr.selected { background: var(--hover); box-shadow: inset 3px 0 0 var(--selected-border); }
.login { font-weight: 600; white-space: nowrap; }
.login.fresh { color: var(--good); }
.login.aging { color: var(--warn); }
.login.old { color: var(--bad); }
.login.never { color: var(--never); font-weight: 400; font-style: italic; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: calc(12px * var(--text-scale)); }
.pill { display: inline-block; font-size: calc(11px * var(--text-scale)); border: 1px solid var(--border-strong); border-radius: 9px; padding: 0 7px; color: var(--fg-dim); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gap); margin-bottom: var(--section-gap); }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: var(--card-p); }
.tile .label { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); }
.tile .value { font-size: calc(24px * var(--text-scale)); font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: var(--section-gap); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: var(--card-p); min-width: 0; }
.card h3 { margin-top: 0; }
.stack > * + * { margin-top: var(--block); }
.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { padding: var(--cell-py) 0; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.list-plain li:last-child { border-bottom: 0; }
.code-line { display: flex; gap: 6px; align-items: center; margin-top: 4px; width: 100%; }
.code-line code { flex: 1 1 auto; min-width: 0; overflow-x: auto; white-space: pre; background: var(--panel-2); padding: 3px 6px; border-radius: 4px; font-size: calc(12px * var(--text-scale)); }
details > summary { cursor: pointer; padding: var(--cell-py) 0; }
.deck summary { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.deck .cards { columns: 2 14em; font-size: calc(12px * var(--text-scale)); margin: var(--block) 0; padding-left: 0; list-style: none; }
.deck .cards li { break-inside: avoid; }
.back { margin-bottom: var(--block); }

/* Charts: thin 2px lines, recessive grid, a crosshair and tooltip on hover. */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--border); stroke-width: 1; }
.chart .axis text { fill: var(--fg-dim); font-size: calc(11px * var(--text-scale)); }
.chart .series path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .series circle { stroke: var(--panel); stroke-width: 2; }
.chart .label text { font-size: calc(11px * var(--text-scale)); fill: var(--fg); }
.chart .cross { stroke: var(--fg-dim); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .tip {
  position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: 6px; padding: 6px 8px; font-size: calc(12px * var(--text-scale)); box-shadow: var(--shadow); white-space: nowrap; z-index: 5;
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: calc(12px * var(--text-scale)); color: var(--fg); margin-bottom: 4px; }
.swatch { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* Footer: pushed to the foot of the page when the content is short. */
.build-info {
  margin-top: auto;
  padding: 18px 0 10px;
  font-size: calc(12px * var(--text-scale));
  line-height: 1.5;
  color: var(--fg-dim);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  min-width: 0;
}
.changelog-trigger {
  display: block;
  width: 100%;
  margin-top: 0.35rem;
  padding: 0;
  min-height: 0;
  border: none;
  background: none;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  /* One line only: the full text lives in the dialog. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.changelog-trigger:hover:not(:disabled), .changelog-trigger:focus-visible { color: var(--fg); background: none; }

/* Dialogs */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; z-index: 50; }
.sheet { background: var(--panel); color: var(--fg); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow); width: min(620px, 100%); padding: var(--card-p); max-height: 80vh; max-height: 80dvh; display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: var(--block); }
.sheet-title { margin: 0; font-size: calc(17px * var(--text-scale)); }
.changelog-list {
  margin: 0;
  padding-left: 1.1rem;
  font-size: calc(13px * var(--text-scale));
  line-height: 1.6;
  /* A long changelog scrolls inside the panel rather than growing it. */
  max-height: 28rem;
  overflow-y: auto;
}
.changelog-list li { margin-bottom: 7px; }

/* Command palette */
.palette-scrim { padding-top: 12vh; }
.palette { background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow); width: min(640px, 100%); display: flex; flex-direction: column; overflow: hidden; }
.palette input { border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 12px 14px; font-size: calc(15px * var(--text-scale)); background: var(--panel); width: 100%; }
.palette input:focus-visible { outline: none; }
.palette ul { list-style: none; margin: 0; padding: 4px; overflow-y: auto; max-height: min(420px, 60vh); max-height: min(420px, 60dvh); }
.palette li { display: flex; align-items: center; gap: 10px; padding: var(--btn-py) 10px; border-radius: 6px; cursor: pointer; min-height: max(30px, var(--target)); }
.palette li.active { background: var(--hover); box-shadow: inset 2px 0 0 var(--selected-border); }
.palette li[aria-disabled="true"] { opacity: 0.5; cursor: default; }
.palette .p-group { font-size: calc(11px * var(--text-scale)); color: var(--fg-dim); min-width: 5.5em; flex: none; text-transform: uppercase; letter-spacing: 0.03em; }
.palette .p-main { flex: 1 1 auto; min-width: 0; }
.palette .p-label { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette .p-snippet { display: block; font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette .p-empty { color: var(--fg-dim); cursor: default; }
.palette .p-sep { font-size: calc(11px * var(--text-scale)); color: var(--fg-dim); padding: 6px 10px 2px; cursor: default; min-height: 0; text-transform: uppercase; letter-spacing: 0.03em; }
@media (pointer: coarse) { .palette li { min-height: max(38px, var(--target)); } }
@media (max-width: 600px) {
  .palette-scrim { padding: 8px 8px 0; }
  .palette { width: 100%; }
  /* The on-screen keyboard takes half the screen: measure against the visible viewport. */
  .palette ul { max-height: 45vh; max-height: 45dvh; max-height: calc(var(--vvh, 100dvh) - 110px); }
}

/* Settings menu */
.settings { position: relative; }
.settings-panel {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
  width: min(340px, calc(100vw - 32px));
  max-height: calc(100vh - 90px); max-height: calc(100dvh - 90px); overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow);
  padding: var(--card-p);
}
.settings-panel fieldset { border: 0; padding: 0; margin: 0 0 var(--section-gap); min-width: 0; }
.settings-panel legend { font-weight: 600; padding: 0; margin-bottom: 6px; font-size: calc(13px * var(--text-scale)); }
.choice { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: start; padding: 4px 0; cursor: pointer; min-height: var(--target); }
.choice input { margin: 3px 0 0; }
.choice small { grid-column: 2; color: var(--fg-dim); font-size: calc(12px * var(--text-scale)); }
.segmented { display: flex; }
.segmented label { flex: 1 1 0; display: flex; }
/* The radio stays in the page for keyboard and screen readers; the span is what shows. */
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.segmented span {
  flex: 1 1 auto; display: grid; place-items: center; min-height: var(--target);
  padding: var(--btn-py) 4px; border: 1px solid var(--border-strong); background: var(--panel-2); cursor: pointer;
  font-size: calc(13px * var(--text-scale));
}
.segmented label + label span { border-left-width: 0; }
.segmented label:first-child span { border-radius: 5px 0 0 5px; }
.segmented label:last-child span { border-radius: 0 5px 5px 0; }
.segmented input:checked + span { color: var(--accent); background: var(--hover); border-color: var(--selected-border); font-weight: 600; }
.segmented input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg-tip { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); margin-top: 4px; }
.screen-info { font-size: calc(12px * var(--text-scale)); color: var(--fg-dim); border-top: 1px solid var(--border); padding-top: var(--block); }

@media (max-width: 600px) {
  .app { padding: 0 12px; }
  .bar-right .live-time { display: none; }
  .palette-trigger kbd { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 class="brand">MtgaDash</h1>

<script id="pure">

  function parseChangelog(text) {

  function filterCommands(commands, query) {

      var hay = (c.group + " " + c.label).toLowerCase();

    return leading.concat(hits.filter(function (c) { return leading.indexOf(c) < 0; }));

  function accountText(a) {

  }

  function matchesAccount(a, query) {

    return terms.every(function (t) { return hay.indexOf(t) >= 0; });

   * characters around the match, with an ellipsis on each cut side.
   */
  function snippet(text, query, width) {
    width = width || 80;
    var term = String(query || "").trim().toLowerCase().split(/\s+/)[0] || "";
    var lines = String(text || "").split(/\r?\n/);
    var line = lines[0] || "";
    if (term) {
      for (var i = 0; i < lines.length; i++) {
        if (lines[i].toLowerCase().indexOf(term) >= 0) { line = lines[i]; break; }
      }

    line = line.replace(/^\s*(#{1,6}\s+|>\s*|[-*+]\s+|\d+[.)]\s+)+/, "").replace(/[*_`]+/g, "").trim();

  function relativeTime(iso, nowMs) {

  document.addEventListener("keydown", function (e) {
    var mod = e.ctrlKey || e.metaKey;
    var k = e.key.toLowerCase();
    // Ctrl+K works everywhere, even inside a text field, and reopens on the current filter.
    if (mod && !e.shiftKey && k === "k") { e.preventDefault(); openPalette(state.filter); return; }
    if (mod && e.shiftKey && k === "p") { e.preventDefault(); openPalette(""); return; }
    if (mod || e.altKey || palette) return;
    if (document.querySelector(".scrim")) return;
    if (e.key === "Escape" && settingsPanel) { toggleSettings(false); document.getElementById("settings-button").focus(); return; }
    var typing = e.target && e.target.closest && e.target.closest("input, textarea, select, [contenteditable='true']");
    if (typing) return;
    if (e.key === "/") { e.preventDefault(); openPalette(state.filter); return; }
    if (e.key === "Escape" && state.route.view === "account") { go("accounts"); return; }
    var v = VIEWS.filter(function (x) { return x.key === e.key; })[0];
    if (v) { go(v.id); return; }
    if (k === "r" && !READ_ONLY) { load(); return; }
    if (k === "f") { e.preventDefault(); focusTableFilter(); return; }
    if (k === "c" && currentEmail()) { copyText(currentEmail()); return; }
  });

  // ---------- Start ----------

  document.getElementById("palette-trigger").addEventListener("click", function () { openPalette(state.filter); });
  document.getElementById("search-clear").addEventListener("click", function () { setFilter(""); document.getElementById("palette-trigger").focus(); });
  document.getElementById("settings-button").addEventListener("click", function () { toggleSettings(); });
  window.addEventListener("hashchange", onRoute);
  if (READ_ONLY) document.title = CFG.appName + " (snapshot)";
  state.route = parseRoute();
  if (state.route.view === "account") state.selectedEmail = state.route.email;
  if (state.route.view === "activity") loadActivity();
  renderFooter();
  loadChangelog();
  load();
  connectLive();
  // Polls run without changing data, so the status (last poll, file sizes) is refreshed on its own.
  if (!READ_ONLY) setInterval(function () { if (!document.hidden) refreshStatus(); }, 15000);
  // The Activity tab changes on every poll, not only when data changes, so it refreshes on its own while open.
  if (!READ_ONLY) setInterval(function () {
    if (!document.hidden && state.route.view === "activity" && state.activityAuto && !document.querySelector(".scrim")) loadActivity();
  }, 3000);
})();
</script>
</body>
</html>
